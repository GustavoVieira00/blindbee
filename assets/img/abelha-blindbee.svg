<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 10 310 285" role="img" aria-labelledby="title desc"><title id="title">Abelha Blindbee com óculos escuros</title><desc id="desc">Mascote abelha amarela e preta com asas brancas e listras curvas alinhadas ao corpo.</desc>
<!-- white wings -->
<path d="M190 134 C164 98 165 46 195 32 C231 12 256 51 260 90 C286 58 329 64 339 101 C349 140 317 167 292 183" fill="#fffdf8" stroke="#090909" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
